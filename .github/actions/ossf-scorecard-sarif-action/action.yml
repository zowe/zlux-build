name: "OSSF Scorecard SARIF"
description: "Runs Scorecard and outputs SARIF results."
inputs:
  results_file:
    description: "Path to the SARIF results file"
    required: true
    default: results.sarif

runs:
  using: "composite"
  steps:
    - name: "Run OSSF Scorecard analysis"
      uses: ossf/scorecard-action@v2.3.0
      with:
        results_file: ${{ inputs.results_file }}
        results_format: sarif
        publish_results: false
        
    - name: "Generate Scorecard Findings Summary"
      shell: bash
      run: |
        echo "# Scorecard Results" > scorecard-summary.md
        echo "" >> scorecard-summary.md
        echo "**Repository:** https://github.com/${GITHUB_REPOSITORY}" >> scorecard-summary.md
        echo "**Workflow Run:** https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> scorecard-summary.md
        echo "" >> scorecard-summary.md
        echo "| Check ID | Findings |" >> scorecard-summary.md
        echo "|----------|----------|" >> scorecard-summary.md
        for id in TokenPermissionsID PinnedDependenciesID BranchProtectionID ContributorsID DangerousWorkflowID; do
          count=$(jq --arg id "$id" '[.runs[].results[] | select(.ruleId == $id)] | length' "${{ inputs.results_file }}")
          echo "| $id | $count |" >> scorecard-summary.md
        done
