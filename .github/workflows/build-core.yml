name: Build Core

on:
  workflow_call:
    secrets:
      SSH_MARIST_USERNAME:
        required: false
      SSH_MARIST_RACF_PASSWORD:
        required: false
    inputs:
      SOURCE_REPO:
        required: false
        type: string
      SOURCE_PR:
        required: false
        type: string
      ZLUX_APP_MANAGER:
        required: false
        type: string
        description: 'zlux-app-manager PR number'
      ZLUX_APP_SERVER:
        required: false
        type: string
        description: 'zlux-app-server PR number'
      ZLUX_BUILD:
        required: false
        type: string
        description: 'zlux-build PR number'
      ZLUX_PLATFORM:
        required: false
        type: string
        description: 'zlux-platform PR number'
      ZLUX_SERVER_FRAMEWORK:
        required: false
        type: string
        description: 'zlux-server-framework PR number'
      ZLUX_SHARED:
        required: false
        type: string
        description: 'zlux-shared PR number'
      DEFAULT_BRANCH:
        required: false
        type: string
        default: v3.x/staging

  schedule:
    - cron: '30 6 * * *'

  push:
    branches:
      - v3.x/staging
      - v3.x/rc
      - v3.x/master

  pull_request:
    types: [opened, reopened, synchronize]

  workflow_dispatch:
    inputs:
      ZLUX_APP_MANAGER:
        required: false
      ZLUX_APP_SERVER:
        required: false
      ZLUX_BUILD:
        required: false
      ZLUX_PLATFORM:
        required: false
      ZLUX_SERVER_FRAMEWORK:
        required: false
      ZLUX_SHARED:
        required: false
      DEFAULT_BRANCH:
        required: false
        default: v3.x/staging

permissions: {}

jobs:
  check-permission:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # this action will fail the whole workflow if permission check fails
      - name: check permission
        uses: zowe-actions/shared-actions/permission-check@77d7d9b50e60fedc8132b5e5eb6d611c4e483416 # main
        with:
          user: ${{ github.actor }}
          github-repo: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  update-changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      was_updated: ${{ steps.check-change.outputs.change_detected }}
      check_commit: ${{ steps.check-changelog.outputs.check_commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check for updated CHANGELOG.md using git
        id: check-changelog
        run: |
          if git diff --name-only origin/${{ github.base_ref }} | grep -q "^CHANGELOG.md$"; then
            echo "CHANGELOG.md has been updated."
            echo "::set-output name=check_commit::true"
          else
            echo "ERROR: CHANGELOG.md has not been updated."
            echo "::set-output name=check_commit::false"
          fi
      - name: Compare PR description with template
        if: steps.check-changelog.outputs.check_commit == 'false'
        env:
          PR_DESCRIPTION: ${{ github.event.pull_request.body }}
        run: |
          # Safely print the PR description using Node.js
          
          node -e "const fs=require('fs'); fs.writeFileSync('/tmp/pr_description.txt', process.env.PR_DESCRIPTION);"
          # Use diff to compare the two files
          if diff -wB /tmp/pr_description.txt .github/pull_request_template.md > /dev/null; then
            echo "ERROR: PR description is identical to the template."
            exit 1
          else
            echo "PR description and template are different."
          fi

      - name: Check PR body against changelog
        if: steps.check-changelog.outputs.check_commit == 'false'
        id: extract-changelog
        run: |
          result=$(node .github/workflows/set-changelog.js ${{ github.event.pull_request.number }})
          if [ "$result" = "Success" ]; then
            git config --global user.email "zowe-robot@users.noreply.github.com"
            git config --global user.name "Zowe Robot"
            git add CHANGELOG.md
            git commit -s -m "Update changelog with PR #${{ github.event.pull_request.number }} description"
            git push
            echo "Updated CHANGELOG from description"
          else
            echo $result
            echo -e "No changelog and version information found in PR description. Please add them.\nExpected Format:\nVERSION:X.XX.X\nCHANGELOG:This is changelog note.\nTo re-run the action, just make a push or commit after updating the PR description or updating the changelog via a manual file changing commit."
            exit 1
          fi

      - name: check for changes
        id: check-change
        run: |
          if git diff --name-only HEAD^ HEAD | grep 'changelog.md'; then
            echo "No Changes detected, setting flag to false"
            echo "::set-output name=change_detected::false"
          else
            echo "::set-output name=change_detected::true"
            fi

  check_changelog:
    if: github.event_name == 'pull_request'
    needs: update-changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify Changelog update
        run: |
          if [ "${{ needs.update-changelog.outputs.was_updated }}" != "true" ]; then
            echo "CHANGELOG.md not updated, please update CHANGELOG.md with the changes made in the pull request"
            exit 1
          else
            echo "changelog was updated successfully."
          fi
  

  build:
    runs-on: ubuntu-latest
    needs: check-permission
    permissions:
      contents: read
    env:
      SOURCE_REPO: ${{ inputs.SOURCE_REPO }}
      SOURCE_PR: ${{ inputs.SOURCE_PR }}
    steps:
      - name: '[Prep 0] normalize inputs'
        shell: bash
        run: |
          set -e
          if [ "${GITHUB_EVENT_NAME}" = "workflow_call" ]; then
            echo "Using workflow_call inputs"
            echo "ZLUX_APP_MANAGER=${{ inputs.ZLUX_APP_MANAGER }}" >> $GITHUB_ENV
            echo "ZLUX_APP_SERVER=${{ inputs.ZLUX_APP_SERVER }}" >> $GITHUB_ENV
            echo "ZLUX_BUILD=${{ inputs.ZLUX_BUILD }}" >> $GITHUB_ENV
            echo "ZLUX_PLATFORM=${{ inputs.ZLUX_PLATFORM }}" >> $GITHUB_ENV
            echo "ZLUX_SERVER_FRAMEWORK=${{ inputs.ZLUX_SERVER_FRAMEWORK }}" >> $GITHUB_ENV
            echo "ZLUX_SHARED=${{ inputs.ZLUX_SHARED }}" >> $GITHUB_ENV
            echo "DEFAULT_BRANCH=${{ inputs.DEFAULT_BRANCH }}" >> $GITHUB_ENV
          else
            echo "Using event inputs"
            echo "ZLUX_APP_MANAGER=${{ github.event.inputs.ZLUX_APP_MANAGER }}" >> $GITHUB_ENV
            echo "ZLUX_APP_SERVER=${{ github.event.inputs.ZLUX_APP_SERVER }}" >> $GITHUB_ENV
            echo "ZLUX_BUILD=${{ github.event.inputs.ZLUX_BUILD }}" >> $GITHUB_ENV
            echo "ZLUX_PLATFORM=${{ github.event.inputs.ZLUX_PLATFORM }}" >> $GITHUB_ENV
            echo "ZLUX_SERVER_FRAMEWORK=${{ github.event.inputs.ZLUX_SERVER_FRAMEWORK }}" >> $GITHUB_ENV
            echo "ZLUX_SHARED=${{ github.event.inputs.ZLUX_SHARED }}" >> $GITHUB_ENV
            echo "DEFAULT_BRANCH=${{ github.event.inputs.DEFAULT_BRANCH }}" >> $GITHUB_ENV
          fi

      - name: '[Prep 1] Checkout'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: '[Prep 2] Validate package.json'
        uses: zowe-actions/shared-actions/validate-package-json@77d7d9b50e60fedc8132b5e5eb6d611c4e483416 # main

      - name: '[Prep 3] Setup Node'
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: '[Prep 4] Setup jFrog CLI'
        uses: jfrog/setup-jfrog-cli@11ee3f9bb82595485cb55670e4f93885080e183b # v2
        env:
          JF_ARTIFACTORY_1: ${{ secrets.JF_ARTIFACTORY_TOKEN }}

      - name: '[Prep 5] prepare workflow'
        uses: zowe-actions/zlux-builds/core/prepare@45cd8dc50de64566783bd0f69ea8ae6de830d69a # v3.x/main
        with:
          github-user: ${{ secrets.ZOWE_ROBOT_USER }}
          github-password: ${{ secrets.ZOWE_ROBOT_TOKEN }}
          github-email: ${{ secrets.ZOWE_ROBOT_EMAIL }}
          github-branch: ${{ github.event.inputs.BRANCH_NAME }}
          default-base: ${{ github.event.inputs.DEFAULT_BRANCH }}

      - name: '[Prep 6] Cache node modules'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache the npm content-addressable store so that npm ci can install
          # from the local cache instead of downloading from the registry.
          # Placed after 'prepare workflow' so all repos are checked out and
          # their package-lock.json files are visible to hashFiles. Any lockfile
          # change (including a post-compromise rotation) produces a new cache
          # key, evicting stale tarballs. GitHub Actions automatically evicts entries
          path: ~/.npm
          key: ${{ runner.os }}-npm-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-node${{ steps.setup-node.outputs.node-version }}-
            ${{ runner.os }}-npm-

      - name: '[Prep 7] build'
        uses: zowe-actions/zlux-builds/core/build@45cd8dc50de64566783bd0f69ea8ae6de830d69a # v3.x/main
        with:
          zlux-app-manager: ${{ env.ZLUX_APP_MANAGER }}
          zlux-app-server: ${{ env.ZLUX_APP_SERVER }}
          zlux-build: ${{ env.ZLUX_BUILD }}
          zlux-platform: ${{ env.ZLUX_PLATFORM }}
          zlux-server-framework: ${{ env.ZLUX_SERVER_FRAMEWORK }}
          zlux-shared: ${{ env.ZLUX_SHARED }}

      - name: '[Prep 8] packaging'
        uses: zowe-actions/zlux-builds/core/package@45cd8dc50de64566783bd0f69ea8ae6de830d69a # v3.x/main
        with:
          pax-ssh-username: ${{ secrets.SSH_MARIST_USERNAME }}
          pax-ssh-password: ${{ secrets.SSH_MARIST_RACF_PASSWORD }}
          pax-name: zlux-core
          
      - name: '[Prep 9] deploy'
        uses: zowe-actions/zlux-builds/core/deploy@45cd8dc50de64566783bd0f69ea8ae6de830d69a # v3.x/main
        
